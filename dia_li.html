<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Phần môn Địa lí 6</title>
    <style>
        :root {
            --primary: #0d9488;
            --secondary: #0284c7;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --correct: #16a34a;
            --wrong: #dc2626;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1, h2 { color: var(--primary); text-align: center; }
        .section-header { background-color: #ccfbf1; color: #115e59; padding: 10px 15px; border-radius: 6px; margin-top: 25px; font-weight: bold; }
        .start-screen { text-align: center; padding: 40px 20px; }
        .form-group { margin: 20px 0; }
        input[type="text"] { width: 80%; max-width: 400px; padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 6px; outline: none; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 28px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #115e59; }
        .timer-bar { position: sticky; top: 0; background: #fff; padding: 10px; border-bottom: 2px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .question-card { border: 1px solid #e2e8f0; padding: 18px; border-radius: 8px; margin: 15px 0; background: #fff; }
        .options label { display: block; margin: 8px 0; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; }
        .options label:hover { background-color: #f1f5f9; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; resize: vertical; }
        .true-false-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .true-false-table th, .true-false-table td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
        .true-false-table th { background-color: #f8fafc; }
        .score-board { background: #f0fdf4; border: 2px solid #bbf7d0; padding: 20px; border-radius: 8px; margin-bottom: 25px; text-align: center; }
        .badge-correct { color: var(--correct); font-weight: bold; }
        .badge-wrong { color: var(--wrong); font-weight: bold; }
        .hidden { display: none; }
        .nav-link { display: inline-block; margin-bottom: 15px; color: var(--secondary); text-decoration: none; font-weight: bold; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-link">&larr; Quay lại Trang chủ</a>
    
    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="startScreen" class="start-screen">
        <h1>ÔN TẬP PHẦN MÔN ĐỊA LÍ 6</h1>
        <p>Kiểm tra Giữa kì I - Năm học 2026 - 2027</p>
        <div class="form-group">
            <input type="text" id="studentName" placeholder="Nhập họ và tên học sinh..." required>
        </div>
        <button onclick="startQuiz()">BẮT ĐẦU LÀM BÀI</button>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="quizScreen" class="hidden">
        <div class="timer-bar">
            <div>Học sinh: <strong id="displayName"></strong></div>
            <div>Thời gian: <strong id="timer">00:00</strong></div>
        </div>
        <form id="quizForm">
            <div id="questionsContainer"></div>
            <div style="text-align: center; margin-top: 30px;">
                <button type="button" onclick="submitQuiz()">NỘP BÀI</button>
            </div>
        </form>
    </div>

    <!-- MÀN HÌNH KẾT QUẢ -->
    <div id="resultScreen" class="hidden">
        <h2>KẾT QUẢ PHÂN MÔN ĐỊA LÍ</h2>
        <div class="score-board">
            <h3 id="resultStudentName"></h3>
            <p id="resultTime"></p>
            <div style="font-size: 18px; margin: 15px 0;">
                Tổng điểm đánh giá: <strong id="totalScore">0</strong> / <strong id="maxScore">0</strong>
            </div>
        </div>
        <div id="reviewContainer"></div>
        <div style="text-align: center; margin-top: 30px; display: flex; justify-content: center; gap: 15px;">
            <button onclick="location.reload()">LÀM LẠI BÀI</button>
            <button onclick="window.location.href='index.html'" style="background-color: #64748b;">VỀ TRANG CHỦ</button>
        </div>
    </div>
</div>

<script>
const rawData = {
    dl_mcq: [

        { q: "Kinh tuyến gốc được ghi số độ là", a: ["0°."], w: ["90°.", "180°.", "360°."] },

        { q: "Bán kính của Trái Đất tại xích đạo là", a: ["6 378 km."], w: ["40 076 km.", "3 678 km.", "510 km."] },
        { q: "Đường xích đạo chia Trái Đất thành hai nửa bằng nhau là", a: ["bán cầu Bắc và bán cầu Nam."], w: ["bán cầu Đông và bán cầu Tây.", "bán cầu Đông và bán cầu Nam.", "bán cầu Bắc và bán cầu Tây."] },
        { q: "Một địa điểm có vĩ độ là 0° thì địa điểm đó nằm trên", a: ["đường xích đạo."], w: ["kinh tuyến gốc.", "chí tuyến Bắc.", "vòng cực Bắc."] },
        { q: "Các loại kí hiệu thường được sử dụng trên bản đồ là", a: ["kí hiệu điểm, kí hiệu đường, kí hiệu diện tích."], w: ["kí hiệu hình học, kí hiệu chữ, kí hiệu tượng hình.", "kí hiệu điểm, kí hiệu chữ, kí hiệu diện tích.", "kí hiệu đường, kí hiệu hình học, kí hiệu màu."] },
        { q: "Trên bản đồ hành chính, sân bay, cảng biển thường được thể hiện bằng loại kí hiệu nào?", a: ["Kí hiệu điểm."], w: ["Kí hiệu đường.", "Kí hiệu diện tích.", "Kí hiệu chữ."] },
        { q: "Theo thứ tự xa dần Mặt Trời, Trái Đất nằm ở vị trí thứ", a: ["ba."], w: ["hai.", "tư.", "năm."] },
        { q: "Vĩ tuyến gốc (0°) còn được gọi là", a: ["đường xích đạo."], w: ["kinh tuyến gốc.", "chí tuyến Bắc.", "v vòng cực Nam."] },
        { q: "Kinh tuyến là", a: ["nửa đường tròn nối hai cực trên bề mặt quả Địa Cầu."], w: ["những vòng tròn vuông góc với các kinh tuyến.", "đường tròn lớn nhất chia đôi quả Địa Cầu thành bán cầu Bắc và bán cầu Nam.", "những đường song song với đường xích đạo."] },
        { q: "Muốn hiểu được ý nghĩa của các kí hiệu trên bản đồ, chúng ta phải dựa vào", a: ["bảng chú giải."], w: ["tỉ lệ bản đồ.", "mạng lưới kinh, vĩ tuyến.", "phương hướng trên bản đồ."] },
        { q: "Trên bản đồ, sông ngòi, đường giao thông, ranh giới hành chính thường được thể hiện bằng loại kí hiệu nào?", a: ["Kí hiệu đường."], w: ["Kí hiệu điểm.", "Kí hiệu diện tích.", "Kí hiệu tượng hình."] },
        { q: "Trái Đất có dạng", a: ["hình cầu."], w: ["hình tròn.", "hình vuông.", "hình bầu dục."] },
        { q: "Kí hiệu bản đồ là gì?", a: ["Các hình vẽ, màu sắc, hoặc chữ viết dùng để biểu hiện các đối tượng địa lí trên bản đồ."], w: ["Những hình ảnh ngẫu nhiên được vẽ trên bản đồ", "Những màu sắc trang trí cho bản đồ", "Những đường kẻ không có ý nghĩa"] },
        { q: "Chú giải bản đồ dùng để:", a: ["Giải thích ý nghĩa các kí hiệu được dùng trên bản đồ"], w: ["Trang trí cho bản đồ đẹp hơn", "Ghi tên các nhà thám hiểm", "Ghi tóm tắt nội dung bản đồ"] },
        { q: "Diện tích bề mặt Trái Đất:", a: ["510 triệu km²"], w: ["400 triệu km²", "100 triệu km²", "1.000 triệu km²"] },
        { q: "Thời gian để Trái Đất chuyển động một vòng quanh trục là:", a: ["24 giờ"], w: ["12 giờ", "365 ngày", "30 ngày"] }
    ],
    dl_tf: [
        {
            title: "Câu 19. Về chuyển động của Trái Đất quanh Mặt Trời (Bộ 1):",
            items: [
                { text: "a) Trái Đất cùng lúc tham gia hai chuyển động: tự quay quanh trục và chuyển động quanh Mặt Trời.", correct: "Đ" },
                { text: "b) Quỹ đạo chuyển động của Trái Đất quanh Mặt Trời có hình tròn.", correct: "S" },
                { text: "c) Thời gian Trái Đất chuyển động hết một vòng quanh Mặt Trời là 365 ngày 6 giờ.", correct: "Đ" },
                { text: "d) Vào mùa đông ở nửa cầu Bắc, thời gian ban ngày dài hơn ban đêm.", correct: "S" }
            ]
        },
        {
            title: "Câu 20. Về chuyển động của Trái Đất quanh Mặt Trời (Bộ 2):",
            items: [
                { text: "a) Trái Đất chuyển động quanh Mặt Trời theo hướng từ tây sang đông.", correct: "Đ" },
                { text: "b) Thời gian Trái Đất chuyển động hết một vòng quanh Mặt Trời là 24 giờ.", correct: "S" },
                { text: "c) Trong khi chuyển động quanh Mặt Trời, trục Trái Đất luôn nghiêng và không đổi hướng.", correct: "Đ" },
                { text: "d) Ở các địa điểm nằm trên đường xích đạo, quanh năm có ngày dài hơn đêm.", correct: "S" }
            ]
        },
        {
            title: "Câu 21. Về chuyển động của Trái Đất quanh Mặt Trời (Bộ 3):",
            items: [
                { text: "a) Quỹ đạo chuyển động của Trái Đất quanh Mặt Trời có hình elip gần tròn.", correct: "Đ" },
                { text: "b) Trái Đất chuyển động quanh Mặt Trời theo hướng từ đông sang tây.", correct: "S" },
                { text: "c) Thời gian Trái Đất chuyển động hết một vòng quanh Mặt Trời là 365 ngày 6 giờ.", correct: "Đ" },
                { text: "d) Càng xa xích đạo về phía hai cực, sự chênh lệch giữa thời gian ngày và đêm càng lớn.", correct: "Đ" }
            ]
        }
    ],
    dl_short: [
        { q: "Câu 1. Khi ở Hà Nội (khu vực giờ số 7) là 12 giờ thì ở Tô-ki-ô – Nhật Bản (khu vực giờ số 9) là mấy giờ?", keywords: ["14"], g: "14 giờ (Tô-ki-ô nhanh hơn Hà Nội 2 giờ)." },
        { q: "Câu 2. Trái Đất tự quay quanh trục theo hướng nào?", keywords: ["tây", "đông"], g: "Từ Tây sang Đông." },
        { q: "Câu 3. Trên bản đồ có tỉ lệ 1 : 100 000, khoảng cách đo được 6 cm thì thực tế là bao nhiêu km?", keywords: ["6"], g: "6 km." },
        { q: "Câu 4. Trên bản đồ, điểm C nằm ở phía trên và lệch về bên trái so với điểm A. Đi từ A đến C là hướng nào?", keywords: ["tây bắc"], g: "Hướng Tây Bắc." },
        { q: "Câu 5. Khi ở Luân Đôn (khu vực giờ số 0) là 8 giờ thì ở Hà Nội (khu vực giờ số 7) là mấy giờ?", keywords: ["15"], g: "15 giờ." },
        { q: "Câu 6. Do Trái Đất có dạng hình cầu nên Mặt Trời chỉ chiếu sáng được bao nhiêu phần bề mặt Trái Đất tại một thời điểm?", keywords: ["một nửa", "1/2", "nửa"], g: "Một nửa (1/2) bề mặt Trái Đất." },
        { q: "Câu 7. Trên bản đồ tỉ lệ 1 : 200 000, khoảng cách A và B đo được 5 cm. Thực tế là bao nhiêu km?", keywords: ["10"], g: "10 km." },
        { q: "Câu 8. Trên bản đồ, điểm B nằm ngay bên phải điểm A (cùng vĩ tuyến). Đi từ A đến B là hướng nào?", keywords: ["đông"], g: "Hướng Đông." }
    ],
    dl_essay: [
        { q: "Câu 1. Vì sao khắp mọi nơi trên Trái Đất đều lần lượt có ngày và đêm?", keywords: ["hình cầu", "chiếu sáng", "tự quay", "tây", "đông", "luân phiên"], g: "- Trái Đất có hình cầu nên luôn được chiếu sáng một nửa.\n- Trái Đất tự quay quanh trục từ Tây sang Đông nên ngày đêm luân phiên." },
        { q: "Câu 2. Em hãy vẽ lược đồ trí nhớ thể hiện khuôn viên trường em.", keywords: ["cổng", "phòng học", "sân trường", "nhà xe"], g: "Mô tả đầy đủ các khu vực: cổng trường, dãy phòng học, sân trường, nhà xe..." },
        { q: "Câu 3. Em hãy vẽ lược đồ trí nhớ thể hiện đường đi từ nhà em đến trường.", keywords: ["nhà", "trường", "đường", "mốc"], g: "Mô tả lộ trình đường đi và các đối tượng địa lí quen thuộc trên đường." },
        { q: "Câu 4. Vì sao nếu Trái Đất không tự quay quanh trục thì không có ngày đêm luân phiên?", keywords: ["không", "một nửa", "luôn", "nóng", "lạnh"], g: "Không có ngày đêm luân phiên vì một nửa sẽ luôn là ngày, nửa kia luôn là đêm." },
        { q: "Câu 5. Vì sao khắp mọi nơi trên Trái Đất đều có ngày và đêm luân phiên nhau?", keywords: ["hình cầu", "tự quay", "tây sang đông"], g: "Do dạng khối cầu và chuyển động tự quay quanh trục từ Tây sang Đông." }
    ]
};

function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    let newArray = [...array];
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
    }
    return newArray;
}

let timerInterval;
let secondsPassed = 0;
let processedMCQ = [];

function startQuiz() {
    const name = document.getElementById('studentName').value.trim();
    if (!name) { alert('Vui lòng nhập họ và tên của bạn!'); return; }

    document.getElementById('displayName').innerText = name;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');

    secondsPassed = 0;
    timerInterval = setInterval(() => {
        secondsPassed++;
        let m = Math.floor(secondsPassed / 60).toString().padStart(2, '0');
        let s = (secondsPassed % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
    }, 1000);

    renderQuestions();
}

function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    processedMCQ = [];

    // MCQ
    let html = `<div class="section-header">PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN</div>`;
    rawData.dl_mcq.forEach((item, idx) => {
        let options = shuffle([...item.a.map(x => ({ t: x, c: true })), ...item.w.map(x => ({ t: x, c: false }))]);
        let qId = `dl_mcq_${idx}`;
        processedMCQ.push({ id: qId, q: item.q, options: options });
        html += `
            <div class="question-card">
                <p><strong>Câu ${idx + 1}:</strong> ${item.q}</p>
                <div class="options">
                    ${options.map((opt, oIdx) => `
                        <label><input type="radio" name="${qId}" value="${oIdx}"> ${String.fromCharCode(65 + oIdx)}. ${opt.t}</label>
                    `).join('')}
                </div>
            </div>
        `;
    });

    // TF
    html += `<div class="section-header">PHẦN II: TRẮC NGHIỆM ĐÚNG - SAI</div>`;
    rawData.dl_tf.forEach((group, gIdx) => {
        html += `
            <div class="question-card">
                <p><strong>${group.title}</strong></p>
                <table class="true-false-table">
                    <tr><th>Nhận định</th><th width="80">Chọn</th></tr>
                    ${group.items.map((it, iIdx) => `
                        <tr>
                            <td>${it.text}</td>
                            <td>
                                <select name="dl_tf_${gIdx}_${iIdx}">
                                    <option value="">--</option>
                                    <option value="Đ">Đúng</option>
                                    <option value="S">Sai</option>
                                </select>
                            </td>
                        </tr>
                    `).join('')}
                </table>
            </div>
        `;
    });

    // Short Answer
    html += `<div class="section-header">PHẦN III: TRẢ LỜI NGẮN</div>`;
    rawData.dl_short.forEach((item, idx) => {
        html += `
            <div class="question-card">
                <p><strong>${item.q}</strong></p>
                <textarea name="dl_s_essay_${idx}" style="height: 60px;" placeholder="Nhập câu trả lời ngắn..."></textarea>
            </div>
        `;
    });

    // Essay
    html += `<div class="section-header">PHẦN IV: TỰ LUẬN</div>`;
    rawData.dl_essay.forEach((item, idx) => {
        html += `
            <div class="question-card">
                <p><strong>${item.q}</strong></p>
                <textarea name="dl_e_essay_${idx}" placeholder="Nhập bài làm tự luận..."></textarea>
            </div>
        `;
    });

    container.innerHTML = html;
}

function submitQuiz() {
    clearInterval(timerInterval);
    let totalScore = 0, maxScore = 0;
    let reviewHtml = '';
    const formData = new FormData(document.getElementById('quizForm'));

    // 1. MCQ Review
    reviewHtml += `<div class="section-header">PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN</div>`;
    processedMCQ.forEach((item, idx) => {
        maxScore += 1;
        let selectedIdx = formData.get(item.id);
        let isCorrect = false, selectedText = "Chưa chọn";
        let correctText = item.options.find(o => o.c).t;

        if (selectedIdx !== null) {
            selectedText = item.options[selectedIdx].t;
            if (item.options[selectedIdx].c) { isCorrect = true; totalScore += 1; }
        }
        reviewHtml += `
            <div class="question-card">
                <p><strong>Câu ${idx + 1}:</strong> ${item.q}</p>
                <p>Học sinh chọn: <span class="${isCorrect ? 'badge-correct' : 'badge-wrong'}">${selectedText}</span></p>
                ${!isCorrect ? `<p>Đáp án đúng: <span class="badge-correct">${correctText}</span></p>` : ''}
            </div>
        `;
    });

    // 2. TF Review
    reviewHtml += `<div class="section-header">PHẦN II: TRẮC NGHIỆM ĐÚNG - SAI</div>`;
    rawData.dl_tf.forEach((group, gIdx) => {
        reviewHtml += `<div class="question-card"><p><strong>${group.title}</strong></p>`;
        group.items.forEach((it, iIdx) => {
            maxScore += 1;
            let userVal = formData.get(`dl_tf_${gIdx}_${iIdx}`) || "--";
            let isOk = (userVal === it.correct);
            if(isOk) totalScore += 1;
            reviewHtml += `<p>- ${it.text}<br>Học sinh chọn: <strong class="${isOk ? 'badge-correct' : 'badge-wrong'}">${userVal}</strong> | Đáp án: <strong class="badge-correct">${it.correct}</strong></p>`;
        });
        reviewHtml += `</div>`;
    });

    // 3. Short Answer Review
    reviewHtml += `<div class="section-header">PHẦN III: TRẢ LỜI NGẮN</div>`;
    rawData.dl_short.forEach((item, idx) => {
        maxScore += 1;
        let userAns = formData.get(`dl_s_essay_${idx}`) || "";
        let lowerAns = userAns.toLowerCase();
        let isCorrect = item.keywords.some(kw => lowerAns.includes(kw));
        if(isCorrect) totalScore += 1;

        reviewHtml += `
            <div class="question-card">
                <p><strong>${item.q}</strong></p>
                <p>Học sinh trả lời: <strong class="${isCorrect ? 'badge-correct' : 'badge-wrong'}">${userAns || "Chưa trả lời"}</strong></p>
                <p>Gợi ý đáp án (Ý chính): <span style="color: var(--correct);">${item.g}</span></p>
            </div>
        `;
    });

    // 4. Essay Review
    reviewHtml += `<div class="section-header">PHẦN IV: TỰ LUẬN</div>`;
    rawData.dl_essay.forEach((item, idx) => {
        maxScore += 1;
        let userAns = formData.get(`dl_e_essay_${idx}`) || "";
        let lowerAns = userAns.toLowerCase();
        let matchedKeywords = item.keywords.filter(kw => lowerAns.includes(kw));
        let pointEarned = (matchedKeywords.length / item.keywords.length >= 0.4) ? 1 : 0;
        totalScore += pointEarned;

        reviewHtml += `
            <div class="question-card">
                <p><strong>${item.q}</strong></p>
                <p><strong>Bài làm của học sinh:</strong></p>
                <p style="background: #f8fafc; padding: 10px; border-radius: 4px;">${userAns || "<i>Chưa trả lời</i>"}</p>
                <p><strong>Đánh giá ý chính:</strong> Khớp ${matchedKeywords.length}/${item.keywords.length} từ khóa &rarr; <span class="${pointEarned > 0 ? 'badge-correct' : 'badge-wrong'}">${pointEarned > 0 ? 'ĐẠT (1/1 điểm)' : 'CHƯA ĐẠT (0/1 điểm)'}</span></p>
                <p><strong>Gợi ý đáp án chuẩn:</strong><br><span style="color: var(--correct); white-space: pre-wrap;">${item.g}</span></p>
            </div>
        `;
    });

    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    let m = Math.floor(secondsPassed / 60), s = secondsPassed % 60;
    document.getElementById('resultStudentName').innerText = `Học sinh: ${document.getElementById('studentName').value}`;
    document.getElementById('resultTime').innerText = `Thời gian hoàn thành: ${m} phút ${s} giây`;
    document.getElementById('totalScore').innerText = totalScore;
    document.getElementById('maxScore').innerText = maxScore;
    document.getElementById('reviewContainer').innerHTML = reviewHtml;
}
</script>
</body>
</html>
