<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÔN THI LỊCH SỬ & ĐỊA LÍ 6 - GIỮA KÌ I</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #0284c7;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --correct: #16a34a;
            --wrong: #dc2626;
            --partial: #d97706;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1, h2, h3 {
            color: var(--primary);
            text-align: center;
        }

        .section-header {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 25px;
            font-weight: bold;
        }

        .start-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .form-group {
            margin: 20px 0;
        }

        input[type="text"] {
            width: 80%;
            max-width: 400px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--secondary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--secondary);
        }

        .timer-bar {
            position: sticky;
            top: 0;
            background: #fff;
            padding: 10px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .question-card {
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 8px;
            margin: 15px 0;
            background: #fff;
        }

        .options label {
            display: block;
            margin: 8px 0;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
        }

        .options label:hover {
            background-color: #f1f5f9;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }

        .true-false-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .true-false-table th, .true-false-table td {
            border: 1px solid #cbd5e1;
            padding: 8px;
            text-align: left;
        }

        .true-false-table th {
            background-color: #f8fafc;
        }

        .score-board {
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }

        .badge-correct { color: var(--correct); font-weight: bold; }
        .badge-wrong { color: var(--wrong); font-weight: bold; }
        .badge-partial { color: var(--partial); font-weight: bold; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="startScreen" class="start-screen">
        <h1>ĐỀ CƯƠNG ÔN TẬP MÔN LỊCH SỬ VÀ ĐỊA LÍ 6</h1>
        <p>Kiểm tra Giữa kì I - Năm học 2026 - 2027</p>
        <div class="form-group">
            <input type="text" id="studentName" placeholder="Nhập họ và tên học sinh..." required>
        </div>
        <button onclick="startQuiz()">BẮT ĐẦU LÀM BÀI</button>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="quizScreen" class="hidden">
        <div class="timer-bar">
            <div>Học sinh: <strong id="displayName"></strong></div>
            <div>Thời gian làm bài: <strong id="timer">00:00</strong></div>
        </div>

        <form id="quizForm">
            <div id="questionsContainer"></div>
            <div style="text-align: center; margin-top: 30px;">
                <button type="button" onclick="submitQuiz()">NỘP BÀI</button>
            </div>
        </form>
    </div>

    <!-- MÀN HÌNH KẾT QUẢ -->
    <div id="resultScreen" class="hidden">
        <h2>KẾT QUẢ BÀI LÀM CHI TIẾT</h2>
        <div class="score-board">
            <h3 id="resultStudentName"></h3>
            <p id="resultTime"></p>
            <div style="font-size: 18px; margin: 15px 0;">
                Tổng điểm đánh giá tự động (Ý chính): <strong id="totalScore">0</strong> / <strong id="maxScore">0</strong>
            </div>
        </div>

        <div id="reviewContainer"></div>

        <div style="text-align: center; margin-top: 30px;">
            <button onclick="location.reload()">LÀM LẠI BÀI</button>
        </div>
    </div>
</div>

// Thuật toán xáo trộn mảng
function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    let newArray = [...array];
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
    }
    return newArray;
}

let timerInterval;
let secondsPassed = 0;
let processedMCQ = [];

function startQuiz() {
    const name = document.getElementById('studentName').value.trim();
    if (!name) {
        alert('Vui lòng nhập họ và tên của bạn!');
        return;
    }

    document.getElementById('displayName').innerText = name;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');

    secondsPassed = 0;
    timerInterval = setInterval(() => {
        secondsPassed++;
        let m = Math.floor(secondsPassed / 60).toString().padStart(2, '0');
        let s = (secondsPassed % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
    }, 1000);

    renderQuestions();
}

function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    processedMCQ = [];

    const renderMCQSection = (title, items, prefix) => {
        let html = `<div class="section-header">${title}</div>`;
        items.forEach((item, idx) => {
            let options = shuffle([...item.a.map(x => ({ t: x, c: true })), ...item.w.map(x => ({ t: x, c: false }))]);
            let qId = `${prefix}_mcq_${idx}`;
            processedMCQ.push({ id: qId, q: item.q, options: options });

            html += `
                <div class="question-card">
                    <p><strong>Câu ${idx + 1}:</strong> ${item.q}</p>
                    <div class="options">
                        ${options.map((opt, oIdx) => `
                            <label>
                                <input type="radio" name="${qId}" value="${oIdx}">
                                ${String.fromCharCode(65 + oIdx)}. ${opt.t}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        return html;
    };

    const renderTFSection = (title, items, prefix) => {
        let html = `<div class="section-header">${title}</div>`;
        items.forEach((group, gIdx) => {
            html += `
                <div class="question-card">
                    <p><strong>${group.title}</strong></p>
                    <table class="true-false-table">
                        <tr><th>Nhận định</th><th width="80">Chọn</th></tr>
                        ${group.items.map((it, iIdx) => `
                            <tr>
                                <td>${it.text}</td>
                                <td>
                                    <select name="${prefix}_tf_${gIdx}_${iIdx}">
                                        <option value="">--</option>
                                        <option value="Đ">Đúng</option>
                                        <option value="S">Sai</option>
                                    </select>
                                </td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
            `;
        });
        return html;
    };

    const renderEssaySection = (title, items, prefix) => {
        let html = `<div class="section-header">${title}</div>`;
        items.forEach((item, idx) => {
            html += `
                <div class="question-card">
                    <p><strong>${item.q}</strong></p>
                    <textarea name="${prefix}_essay_${idx}" placeholder="Nhập câu trả lời/bài làm tại đây..."></textarea>
                </div>
            `;
        });
        return html;
    };

    let html = `<h2>PHÂN MÔN LỊCH SỬ</h2>`;
    html += renderMCQSection("PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", rawData.ls_mcq, "ls");
    html += renderTFSection("PHẦN II: TRẮC NGHIỆM ĐÚNG - SAI", rawData.ls_tf, "ls");
    html += renderEssaySection("PHẦN III: TỰ LUẬN", rawData.ls_essay, "ls");

    html += `<h2 style="margin-top: 40px;">PHÂN MÔN ĐỊA LÍ</h2>`;
    html += renderMCQSection("PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", rawData.dl_mcq, "dl");
    html += renderTFSection("PHẦN II: TRẮC NGHIỆM ĐÚNG - SAI", rawData.dl_tf, "dl");
    html += renderEssaySection("PHẦN III: TRẢ LỜI NGẮN", rawData.dl_short, "dl_s");
    html += renderEssaySection("PHẦN IV: TỰ LUẬN", rawData.dl_essay, "dl_e");

    container.innerHTML = html;
}

function submitQuiz() {
    clearInterval(timerInterval);
    
    let totalScore = 0;
    let maxScore = 0;
    let reviewHtml = '';

    const form = document.getElementById('quizForm');
    const formData = new FormData(form);

    // 1. Lịch sử - MCQ
    reviewHtml += `<div class="section-header">PHÂN MÔN LỊCH SỬ - PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN</div>`;
    processedMCQ.slice(0, 18).forEach((item, idx) => {
        maxScore += 1;
        let selectedIdx = formData.get(item.id);
        let isCorrect = false;
        let selectedText = "Chưa chọn";
        let correctText = item.options.find(o => o.c).t;

        if (selectedIdx !== null) {
            selectedText = item.options[selectedIdx].t;
            if (item.options[selectedIdx].c) { isCorrect = true; totalScore += 1; }
        }

        reviewHtml += `
            <div class="question-card">
                <p><strong>Câu ${idx + 1}:</strong> ${item.q}</p>
                <p>Học sinh chọn: <span class="${isCorrect ? 'badge-correct' : 'badge-wrong'}">${selectedText}</span></p>
                ${!isCorrect ? `<p>Đáp án đúng: <span class="badge-correct">${correctText}</span></p>` : ''}
            </div>
        `;
    });

    // 2. Lịch sử - Đúng/Sai
    reviewHtml += `<div class="section-header">PHÂN MÔN LỊCH SỬ - PHẦN II: TRẮC NGHIỆM ĐÚNG - SAI</div>`;
    rawData.ls_tf.forEach((group, gIdx) => {
        reviewHtml += `<div class="question-card"><p><strong>${group.title}</strong></p>`;
        group.items.forEach((it, iIdx) => {
            maxScore += 1;
            let userVal = formData.get(`ls_tf_${gIdx}_${iIdx}`) || "--";
            let isOk = (userVal === it.correct);
            if(isOk) totalScore += 1;
            reviewHtml += `<p>- ${it.text}<br>Học sinh chọn: <strong class="${isOk ? 'badge-correct' : 'badge-wrong'}">${userVal}</strong> | Đáp án: <strong class="badge-correct">${it.correct}</strong></p>`;
        });
        reviewHtml += `</div>`;
    });

    // 3. Lịch sử - Tự luận (Đánh giá theo ý chính / từ khóa)
    reviewHtml += `<div class="section-header">PHÂN MÔN LỊCH SỬ - PHẦN III: TỰ LUẬN</div>`;
    rawData.ls_essay.forEach((item, idx) => {
        maxScore += 1;
        let userAns = formData.get(`ls_essay_${idx}`) || "";
        let lowerAns = userAns.toLowerCase();
        let matchedKeywords = item.keywords.filter(kw => lowerAns.includes(kw));
        let scoreRate = matchedKeywords.length / item.keywords.length;
        let pointEarned = scoreRate >= 0.4 ? 1 : 0; // Đạt >= 40% từ khóa là tính đạt điểm
        totalScore += pointEarned;

        reviewHtml += `
            <div class="question-card">
                <p><strong>${item.q}</strong></p>
                <p><strong>Bài làm của học sinh:</strong></p>
                <p style="background: #f8fafc; padding: 10px; border-radius: 4px;">${userAns || "<i>Chưa trả lời</i>"}</p>
                <p><strong>Đánh giá ý chính:</strong> Khớp ${matchedKeywords.length}/${item.keywords.length} từ khóa quan trọng &rarr; <span class="${pointEarned > 0 ? 'badge-correct' : 'badge-wrong'}">${pointEarned > 0 ? 'ĐẠT (1/1 điểm)' : 'CHƯA ĐẠT (0/1 điểm)'}</span></p>
                <p><strong>Gợi ý đáp án chuẩn:</strong><br><span style="color: var(--correct); white-space: pre-wrap;">${item.g}</span></p>
            </div>
        `;
    });

    // 4. Địa lí - MCQ
    reviewHtml += `<div class="section-header">PHÂN MÔN ĐỊA LÍ - PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN</div>`;
    processedMCQ.slice(18).forEach((item, idx) => {
        maxScore += 1;
        let selectedIdx = formData.get(item.id);
        let isCorrect = false;
        let selectedText = "Chưa chọn";
        let correctText = item.options.find(o => o.c).t;

        if (selectedIdx !== null) {
            selectedText = item.options[selectedIdx].t;
            if (item.options[selectedIdx].c) { isCorrect = true; totalScore += 1; }
        }

        reviewHtml += `
            <div class="question-card">
                <p><strong>Câu ${idx + 1}:</strong> ${item.q}</p>
                <p>Học sinh chọn: <span class="${isCorrect ? 'badge-correct' : 'badge-wrong'}">${selectedText}</span></p>
                ${!isCorrect ? `<p>Đáp án đúng: <span class="badge-correct">${correctText}</span></p>` : ''}
            </div>
        `;
    });

    // 5. Địa lí - Đúng/Sai
    reviewHtml += `<div class="section-header">PHÂN MÔN ĐỊA LÍ - PHẦN II: TRẮC NGHIỆM ĐÚNG - SAI</div>`;
    rawData.dl_tf.forEach((group, gIdx) => {
        reviewHtml += `<div class="question-card"><p><strong>${group.title}</strong></p>`;
        group.items.forEach((it, iIdx) => {
            maxScore += 1;
            let userVal = formData.get(`dl_tf_${gIdx}_${iIdx}`) || "--";
            let isOk = (userVal === it.correct);
            if(isOk) totalScore += 1;
            reviewHtml += `<p>- ${it.text}<br>Học sinh chọn: <strong class="${isOk ? 'badge-correct' : 'badge-wrong'}">${userVal}</strong> | Đáp án: <strong class="badge-correct">${it.correct}</strong></p>`;
        });
        reviewHtml += `</div>`;
    });

    // 6. Địa lí - Trả lời ngắn
    reviewHtml += `<div class="section-header">PHÂN MÔN ĐỊA LÍ - PHẦN III: TRẢ LỜI NGẮN</div>`;
    rawData.dl_short.forEach((item, idx) => {
        maxScore += 1;
        let userAns = formData.get(`dl_s_essay_${idx}`) || "";
        let lowerAns = userAns.toLowerCase();

        reviewHtml += `
            <div class="question-card">
                <p><strong>${item.q}</strong></p>
                <p>Học sinh trả lời: <strong class="${isCorrect ? 'badge-correct' : 'badge-wrong'}">${userAns || "Chưa trả lời"}</strong></p>
                <p>Đáp án chuẩn (Gợi ý ý chính): <span style="color: var(--correct);">${item.g}</span></p>
            </div>
        `;
    });

    // 7. Địa lí - Tự luận
    reviewHtml += `<div class="section-header">PHÂN MÔN ĐỊA LÍ - PHẦN IV: TỰ LUẬN</div>`;
    rawData.dl_essay.forEach((item, idx) => {
        maxScore += 1;
        let userAns = formData.get(`dl_e_essay_${idx}`) || "";
        let lowerAns = userAns.toLowerCase();
        let matchedKeywords = item.keywords.filter(kw => lowerAns.includes(kw));
        let scoreRate = matchedKeywords.length / item.keywords.length;
        let pointEarned = scoreRate >= 0.4 ? 1 : 0;
        totalScore += pointEarned;

        reviewHtml += `
            <div class="question-card">
                <p><strong>${item.q}</strong></p>
                <p><strong>Bài làm của học sinh:</strong></p>
                <p style="background: #f8fafc; padding: 10px; border-radius: 4px;">${userAns || "<i>Chưa trả lời</i>"}</p>
                <p><strong>Đánh giá ý chính:</strong> Khớp ${matchedKeywords.length}/${item.keywords.length} từ khóa &rarr; <span class="${pointEarned > 0 ? 'badge-correct' : 'badge-wrong'}">${pointEarned > 0 ? 'ĐẠT (1/1 điểm)' : 'CHƯA ĐẠT (0/1 điểm)'}</span></p>
                <p><strong>Gợi ý đáp án:</strong><br><span style="color: var(--correct); white-space: pre-wrap;">${item.g}</span></p>
            </div>
        `;
    });

    // Hiển thị kết quả lên màn hình
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('hidden');

    let m = Math.floor(secondsPassed / 60);
    let s = secondsPassed % 60;
    
    document.getElementById('resultStudentName').innerText = `Họ và tên học sinh: ${document.getElementById('studentName').value}`;
    document.getElementById('resultTime').innerText = `Thời gian làm bài: ${m} phút ${s} giây`;
    document.getElementById('totalScore').innerText = totalScore;
    document.getElementById('maxScore').innerText = maxScore;
    document.getElementById('reviewContainer').innerHTML = reviewHtml;
}
